syntax = "proto3";
package demo;

// Wire-Typ 0 (varint):  int32/int64/uint32/uint64/bool/enum
// Wire-Typ 1 (64-Bit):  fixed64/sfixed64/int64/fixed64
// Wire-Typ 2 (len):     string/bytes/embedded message/repeated packed
// Wire-Typ 5 (32-Bit):  fixed32/sfixed32/int32/float
// Wire-Typ 4/6:         Groups (legacy) – im Lehrbeispiel nur erwähnen

enum Status {
  STATUS_UNSPECIFIED = 0; // Pflicht in Proto3
  STATUS_ACTIVE      = 1;
  STATUS_SUSPENDED   = 2;
  STATUS_DELETED     = 3;
}

enum Month {
    MONTH_UNSPECIFIED = 0;
    MONTH_JANUARY     = 1;
    MONTH_FEBRUARY    = 2;
    MONTH_MARCH       = 3;
    MONTH_APRIL       = 4;
    MONTH_MAY         = 5;
    MONTH_JUNE        = 6;
    MONTH_JULY        = 7;
    MONTH_AUGUST      = 8;
    MONTH_SEPTEMBER   = 9;
    MONTH_OCTOBER     = 10;
    MONTH_NOVEMBER    = 11;
    MONTH_DECEMBER    = 12;
}

message Date {
    int32 day   = 1;
    Month month = 2;
    int32 year  = 3;
}

message Profile {
  string avatar_url   = 1;   // Wire-Typ 2 (length-delimited)
  string bio          = 2;
  string locale       = 3;   // z. B. "de-AT"
  uint32  followers   = 4;   // Wire-Typ 0 (varint)
}

message Device {
  string  id          = 1;   // Wire-Typ 2
  string  os          = 2;   // "ios", "android", "web"
  int64   last_seen   = 3;   // Unix-Ts, Wire-Typ 0
  bool    is_primary  = 4;   // Wire-Typ 0 (0 oder 1 Byte)
}

message User {
  fixed64  id         = 1;   // Wire-Typ 1
  string  username    = 2;   // Wire-Typ 2
  string  email       = 3;   // Wire-Typ 2
  uint32  age         = 4;   // Wire-Typ 0
  bool    is_active   = 5;   // Wire-Typ 0
  Status  status      = 7;   // Wire-Typ 0
  Profile profile     = 8;   // Wire-Typ 2 (embedded message)
  repeated string tags  = 9; // Wire-Typ 2 (jedes Element ein String)
  repeated Device devices = 10; // Wire-Typ 2 (repeated Submessages)
  int64   last_login  = 11;  // Wire-Typ 0 (Unix-Ts)

  // oneof: nur EIN Feld gleichzeitig gesetzt → didaktisch sauber
  // für „entweder ODER“ (z. B. Email vs. Phone)
  oneof contact {
    string email_v2   = 12;  // Alternative zu email
    string phone      = 13;  // Wire-Typ 2
  }
}
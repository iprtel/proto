syntax = "proto3";
package datetime;

enum Month {
    MONTH_UNSPECIFIED = 0;
    MONTH_JANUARY     = 1;
    MONTH_FEBRUARY    = 2;
    MONTH_MARCH       = 3;
    MONTH_APRIL       = 4;
    MONTH_MAY         = 5;
    MONTH_JUNE        = 6;
    MONTH_JULY        = 7;
    MONTH_AUGUST      = 8;
    MONTH_SEPTEMBER   = 9;
    MONTH_OCTOBER     = 10;
    MONTH_NOVEMBER    = 11;
    MONTH_DECEMBER    = 12;
}

message Date {
    uint32 day   = 1;
    Month month = 2;
    int32 year  = 3;
}

message DateTime {
    Date date = 1;
    sint32 seconds_from_noon = 2;
}
